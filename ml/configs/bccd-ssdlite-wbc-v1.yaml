dataset:
  root: ~/Downloads/DATASETS/BCCD
  images_manifest: data/bccd-detector-v1/images.csv
  annotations_manifest: data/bccd-detector-v1/annotations.csv
  split_summary: data/bccd-detector-v1/split-summary.json
model:
  architecture: ssdlite320_mobilenet_v3_large
  version: hemoscope-bccd-ssdlite-wbc-v0
  input_size: 320
  pretrained_backbone: true
  trainable_backbone_layers: 3
training:
  seed: 42
  epochs: 25
  batch_size: 8
  learning_rate: 0.001
  momentum: 0.9
  weight_decay: 0.0005
  gradient_clip_norm: 10.0
  lr_milestones: [18, 22]
  lr_gamma: 0.1
  output_dir: artifacts/bccd-ssdlite-wbc-v1
  device: mps
  num_workers: 4
  log_every_batches: 10
validation:
  iou_threshold: 0.5
  candidate_score_threshold: 0.25
