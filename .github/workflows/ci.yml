name: HemoScope CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  api-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install API and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/api[dev]"
          python -m pip install -e "ml/[dev]"
        shell: bash
      - name: Lint Python
        run: python -m ruff check --config services/api/pyproject.toml services/api/app services/api/tests ml/src ml/tests scripts
      - name: Test backend
        run: python -m pytest services/api/tests
        working-directory: .
      - name: Test ML dataset integrity and subject splits
        run: python -m pytest
        working-directory: ml
      - name: Export and verify contracts
        run: |
          python scripts/export_openapi.py
          python scripts/generate_api_types.py
          git diff --exit-code -- packages/contracts/openapi.json apps/mobile/src/types/api.generated.ts

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mobile dependencies
        run: npm ci
      - name: Type check
        run: npm run mobile:typecheck
      - name: Lint mobile
        run: npm run mobile:lint
