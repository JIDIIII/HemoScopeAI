services:
  api:
    platform: linux/arm64
    build:
      context: ../../../services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      HEMOSCOPE_AUTH_MODE: supabase
      HEMOSCOPE_SUPABASE_URL: ${HEMOSCOPE_SUPABASE_URL:?Set HEMOSCOPE_SUPABASE_URL}
      HEMOSCOPE_SUPABASE_PUBLISHABLE_KEY: ${HEMOSCOPE_SUPABASE_PUBLISHABLE_KEY:?Set HEMOSCOPE_SUPABASE_PUBLISHABLE_KEY}
      HEMOSCOPE_SUPABASE_AUTH_TIMEOUT_SECONDS: "5"
      HEMOSCOPE_INFERENCE_PROVIDER: none
      HEMOSCOPE_ENABLE_DEMO_MOCK: "false"
      HEMOSCOPE_MAX_UPLOAD_BYTES: "10485760"
      HEMOSCOPE_MAX_IMAGE_PIXELS: "40000000"
    expose:
      - "8080"
    mem_limit: 6g
    cpus: 1.5
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN to a DNS name pointing at the VM}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for TLS certificate notices}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
